<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-mark.png" />
    <script>
      (function () {
        var t = localStorage.getItem("portfolio-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>POKURU MOHANENDRA — Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of a Full Stack Developer specializing in React, Node.js, Express, MongoDB, and modern web technologies."
    />
    <meta
      name="keywords"
      content="full stack developer, react, node.js, express, mongodb, portfolio, web developer"
    />
    <meta name="author" content="POKURU MOHANENDRA" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yourportfolio.vercel.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourportfolio.vercel.app" />
    <meta
      property="og:title"
      content="POKURU MOHANENDRA — Full Stack Developer"
    />
    <meta
      property="og:description"
      content="Portfolio of a Full Stack Developer specializing in React, Node.js, Express, MongoDB, and modern web technologies."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="POKURU MOHANENDRA — Full Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of a Full Stack Developer specializing in React, Node.js, and MongoDB."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#eaf3fc" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
